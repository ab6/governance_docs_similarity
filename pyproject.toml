[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "governance_docs_similarity"
version = "0.0.1"
description = "Model to measure similarity of new governance documents to exdocs in dataset"
authors = [
  { name = "Amber McKenzie" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
]
requires-python = "==3.14.6"


[tool.ruff]
line-length = 99
src = ["governance_docs_similarity"]
include = ["pyproject.toml", "governance_docs_similarity/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["governance_docs_similarity"]
force-sort-within-sections = true

